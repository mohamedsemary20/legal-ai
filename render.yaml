services:
  - type: web
    name: legal-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false # set it in the Render dashboard — never commit it
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://egysuitsu.netlify.app
